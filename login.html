<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Asistente de Viajes</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
</head>
<body>
    <div id="barra-navegacion-contenedor"></div>

    <main>
        <section id="login_seccion">
            <h1>Iniciar Sesión</h1>
            <form id="login_formulario">
                <div>
                    <label for="login_username">Usuario:</label>
                    <input type="text" id="login_username" name="login_username" required>
                </div>
                <div>
                    <label for="login_password">Contraseña:</label>
                    <input type="password" id="login_password" name="login_password" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p id="login_mensaje_info" class="mensaje-info" style="display:none;"></p> <!-- Changed ID and class for generic messages -->
            <p class="centrado">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Asistente de Viajes a Bélgica</p>
    </footer>
    <script>
        // Script específico para la página de login
        document.addEventListener('DOMContentLoaded', () => {
            const mensajeInfoLogin = document.getElementById('login_mensaje_info');

            // Mostrar mensaje de registro exitoso (si existe)
            const mensajeRegistro = localStorage.getItem('mensaje_login');
            if (mensajeRegistro && mensajeInfoLogin) {
                mensajeInfoLogin.textContent = mensajeRegistro;
                mensajeInfoLogin.className = 'mensaje-exito'; // Usar clase de éxito
                mensajeInfoLogin.style.display = 'block';
                localStorage.removeItem('mensaje_login'); // Limpiar el mensaje
            }

            const formularioLogin = document.getElementById('login_formulario');
            if (formularioLogin) {
                formularioLogin.addEventListener('submit', function(event) {
                    event.preventDefault();
                    const username = document.getElementById('login_username').value;
                    const password = document.getElementById('login_password').value;

                    if (login(username, password)) { // login() es de auth.js
                        window.location.href = 'index.html';
                    } else {
                        if (mensajeInfoLogin) {
                            mensajeInfoLogin.textContent = 'Usuario o contraseña incorrectos.';
                            mensajeInfoLogin.className = 'mensaje-error'; // Usar clase de error
                            mensajeInfoLogin.style.display = 'block';
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
